[workspace]
resolver = "2"
members = ["crates/cachy-core", "crates/cachycli"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/LipeMachado/cachycli"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
syntect = { version = "5", default-features = false, features = ["default-fancy", "parsing", "dump-load", "plist-load", "yaml-load", "regex-fancy"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "fs", "signal", "net"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake", "connect"] }
tokio-util = "0.7"
toml = "0.9"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"
